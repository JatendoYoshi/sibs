<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIBS Trip Logger — Sunshine Islands Bus Simulator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  :root {
    --navy: #0d1b3e;
    --navy-mid: #162550;
    --navy-light: #1e3370;
    --gold: #f5c400;
    --gold-dim: #c9a000;
    --gold-pale: #fff8d6;
    --white: #ffffff;
    --off-white: #f0f4ff;
    --grey: #8896b3;
    --grey-light: #dde4f0;
    --green: #22c55e;
    --red: #ef4444;
    --text: #0d1b3e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--navy);
    font-family: 'Barlow', sans-serif;
    color: var(--white);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--navy);
    border-bottom: 3px solid var(--gold);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo-bus {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 2rem;
    color: var(--gold);
    letter-spacing: -1px;
    line-height: 1;
  }
  .logo-text {
    display: flex;
    flex-direction: column;
  }
  .logo-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: 0.05em;
    color: var(--white);
    text-transform: uppercase;
  }
  .logo-sub {
    font-size: 0.7rem;
    color: var(--grey);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .session-badge {
    background: var(--navy-light);
    border: 1px solid var(--navy-light);
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 0.78rem;
    color: var(--grey);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.05em;
  }
  .session-badge span { color: var(--gold); font-weight: 700; }

  /* ── LAYOUT ── */
  .app {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* ── SETUP SCREEN ── */
  #screen-setup { display: block; }
  #screen-logger { display: none; }
  #screen-summary { display: none; }

  .setup-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  @media(max-width:600px){ .setup-grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--navy-mid);
    border: 1px solid var(--navy-light);
    border-radius: 12px;
    padding: 20px 22px;
  }
  .card-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
  }

  label {
    display: block;
    font-size: 0.8rem;
    color: var(--grey);
    margin-bottom: 5px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  input[type=text], input[type=number], input[type=time], select {
    width: 100%;
    background: var(--navy);
    border: 1.5px solid var(--navy-light);
    border-radius: 8px;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-size: 0.95rem;
    padding: 9px 13px;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 14px;
  }
  input:focus, select:focus { border-color: var(--gold); }
  select option { background: var(--navy-mid); }

  .terminus-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .terminus-row input { margin-bottom: 0; flex: 1; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.04em;
    padding: 10px 20px;
    transition: all 0.15s;
  }
  .btn-gold {
    background: var(--gold);
    color: var(--navy);
  }
  .btn-gold:hover { background: #ffd200; transform: translateY(-1px); }
  .btn-navy {
    background: var(--navy-light);
    color: var(--white);
  }
  .btn-navy:hover { background: #2a4a9c; }
  .btn-outline {
    background: transparent;
    border: 1.5px solid var(--navy-light);
    color: var(--grey);
  }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
  .btn-sm { font-size: 0.85rem; padding: 7px 14px; }
  .btn-block { width: 100%; justify-content: center; font-size: 1.1rem; padding: 14px; }
  .btn-green { background: var(--green); color: var(--white); }
  .btn-green:hover { background: #16a34a; }
  .btn-red { background: var(--red); color: var(--white); }
  .btn-red:hover { background: #dc2626; }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    margin-bottom: 24px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--grey);
    margin-bottom: 7px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .progress-track {
    height: 6px;
    background: var(--navy-light);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* ── TRIP DOTS ── */
  .trip-dots {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .trip-dot {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    border: 2px solid var(--navy-light);
    color: var(--grey);
    background: var(--navy-mid);
    transition: all 0.2s;
  }
  .trip-dot.done { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  .trip-dot.active { background: var(--navy-light); border-color: var(--gold); color: var(--white); box-shadow: 0 0 0 3px rgba(245,196,0,0.2); }

  /* ── STOP TRACKER ── */
  .trip-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 18px;
  }
  .trip-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 3rem;
    color: var(--gold);
    line-height: 1;
  }
  .trip-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .trip-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--white);
  }
  .trip-meta {
    font-size: 0.78rem;
    color: var(--grey);
  }

  .bus-details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  @media(max-width:500px){ .bus-details-grid { grid-template-columns: 1fr; } }
  .bus-details-grid .full { grid-column: 1/-1; }

  /* ── STOP ROWS ── */
  .stops-section { margin-bottom: 16px; }
  .stops-heading {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .stop-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--navy);
    border: 1px solid var(--navy-light);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    transition: border-color 0.15s;
  }
  .stop-row.active-stop { border-color: var(--gold); background: rgba(245,196,0,0.04); }
  .stop-row.done-stop { opacity: 0.5; }
  .stop-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--navy-light);
    border: 2px solid var(--navy-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--grey);
    flex-shrink: 0;
  }
  .stop-circle.filled { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  .stop-body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .stop-name-input {
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--navy-light);
    border-radius: 0;
    color: var(--white);
    font-size: 0.95rem;
    padding: 2px 4px;
    margin-bottom: 0;
    width: 100%;
  }
  .stop-name-input:focus { border-bottom-color: var(--gold); outline: none; }
  .stop-times {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .stop-time-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .stop-time-wrap span {
    font-size: 0.7rem;
    color: var(--grey);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .time-input {
    background: var(--navy-mid);
    border: 1px solid var(--navy-light);
    border-radius: 5px;
    color: var(--white);
    font-size: 0.82rem;
    padding: 3px 7px;
    width: 86px;
    margin-bottom: 0;
    font-family: 'Barlow', monospace;
  }
  .stop-dur {
    font-size: 0.72rem;
    color: var(--gold);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    min-width: 50px;
    text-align: right;
  }
  .stop-connector {
    width: 2px;
    height: 16px;
    background: var(--navy-light);
    margin: -4px 0 -4px 27px;
  }

  /* ── SUMMARY SCREEN ── */
  .summary-hero {
    background: linear-gradient(135deg, var(--navy-mid) 0%, var(--navy-light) 100%);
    border: 1px solid var(--navy-light);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 24px;
    text-align: center;
  }
  .summary-hero h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 2.4rem;
    color: var(--gold);
    margin-bottom: 4px;
  }
  .summary-hero p { color: var(--grey); font-size: 0.9rem; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }
  @media(max-width:600px){ .stats-row { grid-template-columns: 1fr 1fr; } }
  .stat-box {
    background: var(--navy-mid);
    border: 1px solid var(--navy-light);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .stat-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 2rem;
    color: var(--gold);
    line-height: 1;
  }
  .stat-lbl {
    font-size: 0.7rem;
    color: var(--grey);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 4px;
  }

  .trip-summary-card {
    background: var(--navy-mid);
    border: 1px solid var(--navy-light);
    border-radius: 12px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .trip-summary-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--navy-light);
    cursor: pointer;
    user-select: none;
  }
  .trip-summary-header:hover { background: rgba(255,255,255,0.02); }
  .tsn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 1.8rem;
    color: var(--gold);
    min-width: 44px;
    line-height: 1;
  }
  .ts-meta { flex: 1; }
  .ts-route {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--white);
  }
  .ts-from-to {
    font-size: 0.78rem;
    color: var(--grey);
    margin-top: 2px;
  }
  .ts-dur {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--gold);
  }
  .trip-summary-body {
    padding: 16px 20px;
  }
  .ts-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .pill {
    background: var(--navy);
    border: 1px solid var(--navy-light);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 0.75rem;
    color: var(--grey);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .pill strong { color: var(--white); font-weight: 700; }

  .stop-timeline {
    position: relative;
    padding-left: 20px;
  }
  .stop-timeline::before {
    content: '';
    position: absolute;
    left: 6px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: var(--navy-light);
  }
  .tl-stop {
    position: relative;
    padding: 4px 0 4px 16px;
    font-size: 0.85rem;
  }
  .tl-stop::before {
    content: '';
    position: absolute;
    left: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--navy-light);
    border: 2px solid var(--navy-light);
  }
  .tl-stop.first-stop::before, .tl-stop.last-stop::before {
    background: var(--gold);
    border-color: var(--gold);
  }
  .tl-name { color: var(--white); }
  .tl-times { color: var(--grey); font-size: 0.75rem; }

  /* ── MISC ── */
  .divider {
    height: 1px;
    background: var(--navy-light);
    margin: 20px 0;
  }
  .row-btns {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
  }
  .alert {
    background: rgba(245,196,0,0.08);
    border: 1px solid rgba(245,196,0,0.25);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.85rem;
    color: var(--gold-pale);
    margin-bottom: 16px;
  }
  .text-center { text-align: center; }

  .print-btn {
    display: none;
  }
  @media print {
    header, .row-btns, .btn { display: none !important; }
    body { background: white; color: black; }
    .trip-summary-card { border: 1px solid #ccc; }
    .print-btn { display: block; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-bus">🚌</div>
  <div class="logo-text">
    <div class="logo-title">SIBS Trip Logger</div>
    <div class="logo-sub">Sunshine Islands Bus Simulator</div>
  </div>
  <div class="header-right">
    <div class="session-badge" id="headerBadge" style="display:none">
      Trip <span id="headerTripNum">1</span> of <span id="headerTripTotal">5</span>
    </div>
  </div>
</header>

<div class="app">

  <!-- ══════════════ SETUP SCREEN ══════════════ -->
  <div id="screen-setup">
    <div style="margin-bottom:24px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:2rem;color:var(--gold);margin-bottom:4px">Set Up Your Session</div>
      <div style="color:var(--grey);font-size:0.9rem">Configure how many trips and stops, then set your starting terminus.</div>
    </div>

    <div class="setup-grid">
      <div class="card">
        <div class="card-title">Session Config</div>
        <label>Number of Trips</label>
        <input type="number" id="cfgTrips" value="5" min="1" max="20">
        <label>Stops Per Trip</label>
        <input type="number" id="cfgStops" value="5" min="2" max="20">
        <label>Session Name (optional)</label>
        <input type="text" id="cfgName" placeholder="e.g. Saturday afternoon bash">
      </div>

      <div class="card">
        <div class="card-title">Starting Terminus</div>
        <label>Terminus Name</label>
        <div class="terminus-row" style="margin-bottom:14px">
          <input type="text" id="cfgTerminus" placeholder="Type or generate →" style="margin-bottom:0">
          <button class="btn btn-navy btn-sm" onclick="randomTerminus()">🎲 Random</button>
        </div>
        <label>Starting Operator</label>
        <select id="cfgOperator">
          <option value="">— Any —</option>
          <option value="Forever Transit (FT)">Forever Transit (FT)</option>
          <option value="FT Central Connect (FTCC)">FT Central Connect (FTCC)</option>
          <option value="Cityscape Bus (CSB)">Cityscape Bus (CSB)</option>
          <option value="Horizon Group (HZG)">Horizon Group (HZG)</option>
          <option value="Roblox Express Bus Co. (REBC)">Roblox Express Bus Co. (REBC)</option>
          <option value="Sunshine Islands Bus (SIB)">Sunshine Islands Bus (SIB)</option>
        </select>
      </div>
    </div>

    <button class="btn btn-gold btn-block" onclick="startSession()">🚦 Start Session</button>
  </div>

  <!-- ══════════════ LOGGER SCREEN ══════════════ -->
  <div id="screen-logger">
    <!-- Trip dots -->
    <div class="trip-dots" id="tripDots"></div>

    <!-- Progress -->
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="progLabel">Trip 1 of 5</span>
        <span id="progPct">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    </div>

    <!-- Trip header -->
    <div class="trip-header">
      <div class="trip-num" id="tripNumDisplay">01</div>
      <div class="trip-info">
        <div class="trip-label" id="tripLabelDisplay">Trip 1</div>
        <div class="trip-meta" id="tripMetaDisplay">Fill in the details below</div>
      </div>
    </div>

    <!-- Bus details -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">Bus Details</div>
      <div class="bus-details-grid">
        <div>
          <label>Route Number</label>
          <input type="text" id="fRoute" placeholder="e.g. 42A">
        </div>
        <div>
          <label>Operator</label>
          <select id="fOperator">
            <option value="">— Select —</option>
            <option>Forever Transit (FT)</option>
            <option>FT Central Connect (FTCC)</option>
            <option>Cityscape Bus (CSB)</option>
            <option>Horizon Group (HZG)</option>
            <option>Roblox Express Bus Co. (REBC)</option>
            <option>Sunshine Islands Bus (SIB)</option>
          </select>
        </div>
        <div>
          <label>Fleet Number</label>
          <input type="text" id="fFleet" placeholder="e.g. 1165">
        </div>
        <div>
          <label>Registration Plate</label>
          <input type="text" id="fReg" placeholder="e.g. SN65 ABC">
        </div>
        <div class="full">
          <label>Direction / Destination</label>
          <input type="text" id="fDestination" placeholder="e.g. Sunshine Station">
        </div>
      </div>
    </div>

    <!-- Stops -->
    <div class="card">
      <div class="card-title">Stop Log</div>
      <div id="stopRows"></div>
    </div>

    <div class="row-btns">
      <button class="btn btn-gold" onclick="saveTrip()">✓ Save Trip &amp; Continue</button>
      <button class="btn btn-outline btn-sm" onclick="clearTripForm()">↺ Clear</button>
    </div>
  </div>

  <!-- ══════════════ SUMMARY SCREEN ══════════════ -->
  <div id="screen-summary">
    <div class="summary-hero">
      <div style="font-size:3rem;margin-bottom:8px">🏁</div>
      <h1>Session Complete</h1>
      <p id="summarySessionName" style="margin-top:4px"></p>
    </div>

    <div class="stats-row" id="statsRow"></div>

    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:12px">Trip Breakdown</div>
    <div id="tripCards"></div>

    <div class="row-btns" style="margin-top:24px">
      <button class="btn btn-gold" onclick="window.print()">🖨 Print / Export</button>
      <button class="btn btn-navy" onclick="newSession()">↺ New Session</button>
    </div>
  </div>

</div>

<script>
// ── DATA ──
const TERMINUSES = [
  "Long Island Ferry Pier","Sunshine Station","Sunshine Pier","Central West Bus Terminus",
  "Southern Central Bus Terminus","Container's Island Bus Terminus","East Door Bus Terminus",
  "Rainbow Estate Complex","Dove Estate Bus Terminus","Ambling Peak",
  "Rocky Road","Horizon Depot","Sun Central Street","Praya YiYan Road",
  "Lunar Bay Depot","Leafy Hospital","Northern Beaches","West Moon Island",
  "Shallow Valley Depot","Sunshine Port","North Island Road","Eastmallow Estate"
];

const STOPS_POOL = [
  "Sunshine Station","Central","Norton Estate","Dove Park","Long Island Ferry Pier",
  "Sunshine Pier","Southern Interchange","Eastmallow Estate","University","Lunar Point",
  "Diamond Trading Tower","CSB Depot","Dove Fire Station","Dove Hill","Alexander Road",
  "Alexander Garden","East Door Shopping Center","East Door Hotel","East Door Pier",
  "East Door Garden","East Door Park","East Factory","Leafy Hospital","Leafy Bay Estate",
  "Rainbow Estate Complex","Haisey","Senpai","YiYan","West Moon Island","Culture Square",
  "Downhill Estate","Norton","Sunshine Stadium","Rocky Road","Ambling Peak",
  "Northern Beaches","Sunshine Port","Containers Terminal","Horizon Depot","Choi Wan House",
  "Central West Bus Terminus","Central Fire Station","Central Hospital","Sun Central Street",
  "Praya YiYan Road","Dove Estate","West Long Island","20 Rocky Road","35 Rocky Road",
  "60 Rocky Road","Alexander Church","Alexander Shopping Center"
];

// ── STATE ──
let session = { name:'', trips:5, stopsPerTrip:5, terminus:'', operator:'', startTime: null };
let logs = [];
let currentTrip = 0;

// ── SETUP ──
function randomTerminus(){
  const t = TERMINUSES[Math.floor(Math.random()*TERMINUSES.length)];
  document.getElementById('cfgTerminus').value = t;
}

function startSession(){
  session.trips = Math.max(1, parseInt(document.getElementById('cfgTrips').value)||5);
  session.stopsPerTrip = Math.max(2, parseInt(document.getElementById('cfgStops').value)||5);
  session.name = document.getElementById('cfgName').value.trim() || 'SIBS Session';
  session.terminus = document.getElementById('cfgTerminus').value.trim() || 'Sunshine Station';
  session.operator = document.getElementById('cfgOperator').value;
  session.startTime = new Date();
  logs = [];
  currentTrip = 0;

  document.getElementById('screen-setup').style.display='none';
  document.getElementById('screen-logger').style.display='block';
  document.getElementById('headerBadge').style.display='flex';
  document.getElementById('headerTripTotal').textContent = session.trips;

  buildTripDots();
  loadTrip(0);
}

// ── TRIP DOTS ──
function buildTripDots(){
  const el = document.getElementById('tripDots');
  el.innerHTML = '';
  for(let i=0;i<session.trips;i++){
    const d = document.createElement('div');
    d.className = 'trip-dot' + (i===0?' active':'');
    d.id = 'dot'+i;
    d.textContent = i+1;
    el.appendChild(d);
  }
}

function updateDots(){
  for(let i=0;i<session.trips;i++){
    const d = document.getElementById('dot'+i);
    d.className = 'trip-dot';
    if(i < currentTrip) d.classList.add('done');
    else if(i === currentTrip) d.classList.add('active');
  }
}

// ── LOAD TRIP ──
function loadTrip(idx){
  currentTrip = idx;
  updateDots();

  const pct = Math.round((idx/session.trips)*100);
  document.getElementById('progLabel').textContent = `Trip ${idx+1} of ${session.trips}`;
  document.getElementById('progPct').textContent = pct+'%';
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('tripNumDisplay').textContent = String(idx+1).padStart(2,'0');
  document.getElementById('tripLabelDisplay').textContent = `Trip ${idx+1}`;
  document.getElementById('headerTripNum').textContent = idx+1;

  // Previous trip's last stop becomes this trip's first stop
  const prevLast = idx > 0 && logs[idx-1]
    ? logs[idx-1].stops[logs[idx-1].stops.length-1]?.name || ''
    : session.terminus;

  document.getElementById('tripMetaDisplay').textContent =
    idx===0 ? `Starting from: ${session.terminus}` : `Continuing from Trip ${idx}`;

  // If editing saved trip, repopulate
  const saved = logs[idx];
  document.getElementById('fRoute').value = saved?.route||'';
  document.getElementById('fOperator').value = saved?.operator||session.operator||'';
  document.getElementById('fFleet').value = saved?.fleet||'';
  document.getElementById('fReg').value = saved?.reg||'';
  document.getElementById('fDestination').value = saved?.destination||'';

  buildStopRows(saved?.stops||null, prevLast);
}

// ── BUILD STOP ROWS ──
function buildStopRows(savedStops, firstStopName){
  const container = document.getElementById('stopRows');
  container.innerHTML='';
  for(let s=0;s<session.stopsPerTrip;s++){
    if(s>0){
      const conn=document.createElement('div');
      conn.className='stop-connector';
      container.appendChild(conn);
    }
    const row=document.createElement('div');
    row.className='stop-row'+(s===0?' active-stop':'');
    row.id='stoprow'+s;

    const sv = savedStops?.[s];
    const defaultName = s===0 ? (firstStopName||'') : (sv?.name||'');
    const onName = s===0 ? (sv?.onTime||'') : '';
    const offName = sv?.offTime||'';

    row.innerHTML=`
      <div class="stop-circle ${sv?'filled':''}" id="sc${s}">${s+1}</div>
      <div class="stop-body">
        <input class="stop-name-input" id="sn${s}" placeholder="Stop name…" value="${defaultName}" list="stopSuggest" autocomplete="off">
        <div class="stop-times">
          <div class="stop-time-wrap">
            <span>On</span>
            <input class="time-input" type="time" id="son${s}" value="${onName}">
          </div>
          <div class="stop-time-wrap">
            <span>Off</span>
            <input class="time-input" type="time" id="soff${s}" value="${offName}">
          </div>
          <div class="stop-dur" id="sdur${s}">${sv?.duration||''}</div>
        </div>
      </div>`;
    container.appendChild(row);

    // Auto-calc duration
    const onInput = () => calcDur(s);
    row.querySelector('#son'+s).addEventListener('change', onInput);
    row.querySelector('#soff'+s).addEventListener('change', onInput);
    row.querySelector('#sn'+s).addEventListener('input', () => {
      if(document.getElementById('sn'+s).value.trim())
        document.getElementById('sc'+s).classList.add('filled');
      else
        document.getElementById('sc'+s).classList.remove('filled');
    });

    if(sv?.duration) calcDur(s);
  }

  // Datalist for stop suggestions
  let dl = document.getElementById('stopSuggest');
  if(!dl){
    dl = document.createElement('datalist');
    dl.id='stopSuggest';
    STOPS_POOL.forEach(s=>{ const o=document.createElement('option'); o.value=s; dl.appendChild(o); });
    document.body.appendChild(dl);
  }
}

function calcDur(s){
  const on = document.getElementById('son'+s).value;
  const off = document.getElementById('soff'+s).value;
  const el = document.getElementById('sdur'+s);
  if(!on||!off){ el.textContent=''; return; }
  const [oh,om]=on.split(':').map(Number);
  const [fh,fm]=off.split(':').map(Number);
  let diff = (fh*60+fm)-(oh*60+om);
  if(diff<0) diff+=1440;
  el.textContent = diff>0 ? formatDur(diff) : '';
}

function formatDur(mins){
  if(mins<60) return mins+'m';
  return Math.floor(mins/60)+'h '+(mins%60)+'m';
}

// ── SAVE TRIP ──
function saveTrip(){
  const stops=[];
  let hasName=false;
  for(let s=0;s<session.stopsPerTrip;s++){
    const n = document.getElementById('sn'+s).value.trim();
    const on = document.getElementById('son'+s).value;
    const off = document.getElementById('soff'+s).value;
    const dur = document.getElementById('sdur'+s).textContent;
    if(n) hasName=true;
    stops.push({name:n, onTime:on, offTime:off, duration:dur});
  }
  if(!hasName){
    alert('Please fill in at least one stop name.');
    return;
  }

  const trip = {
    route: document.getElementById('fRoute').value.trim(),
    operator: document.getElementById('fOperator').value,
    fleet: document.getElementById('fFleet').value.trim(),
    reg: document.getElementById('fReg').value.trim(),
    destination: document.getElementById('fDestination').value.trim(),
    stops
  };
  logs[currentTrip] = trip;

  const next = currentTrip+1;
  if(next >= session.trips){
    showSummary();
  } else {
    loadTrip(next);
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

function clearTripForm(){
  document.getElementById('fRoute').value='';
  document.getElementById('fFleet').value='';
  document.getElementById('fReg').value='';
  document.getElementById('fDestination').value='';
  for(let s=0;s<session.stopsPerTrip;s++){
    if(s>0) document.getElementById('sn'+s).value='';
    document.getElementById('son'+s).value='';
    document.getElementById('soff'+s).value='';
    document.getElementById('sdur'+s).textContent='';
    document.getElementById('sc'+s).classList.remove('filled');
  }
}

// ── SUMMARY ──
function showSummary(){
  document.getElementById('screen-logger').style.display='none';
  document.getElementById('screen-summary').style.display='block';
  document.getElementById('headerBadge').style.display='none';

  document.getElementById('summarySessionName').textContent =
    session.name + ' · ' + session.startTime.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});

  // Stats
  let totalMins=0, routesSet=new Set(), stopsSet=new Set();
  logs.forEach(t=>{
    if(t.route) routesSet.add(t.route);
    t.stops.forEach(s=>{
      if(s.name) stopsSet.add(s.name);
      if(s.duration) totalMins += parseDur(s.duration);
    });
  });

  document.getElementById('statsRow').innerHTML=`
    <div class="stat-box"><div class="stat-val">${logs.length}</div><div class="stat-lbl">Trips Logged</div></div>
    <div class="stat-box"><div class="stat-val">${stopsSet.size}</div><div class="stat-lbl">Unique Stops</div></div>
    <div class="stat-box"><div class="stat-val">${routesSet.size}</div><div class="stat-lbl">Routes Used</div></div>
    <div class="stat-box"><div class="stat-val">${formatDur(totalMins)||'—'}</div><div class="stat-lbl">Total Ride Time</div></div>
  `;

  const container = document.getElementById('tripCards');
  container.innerHTML='';
  logs.forEach((t,i)=>{
    const firstStop = t.stops.find(s=>s.name)?.name||'—';
    const lastStop = [...t.stops].reverse().find(s=>s.name)?.name||'—';
    const boardTime = t.stops.find(s=>s.onTime)?.onTime||'';
    const alightTime = [...t.stops].reverse().find(s=>s.offTime)?.offTime||'';
    const totalM = t.stops.reduce((a,s)=>a+(s.duration?parseDur(s.duration):0),0);

    const stopsHtml = t.stops.map((s,si)=>{
      if(!s.name) return '';
      const isFirst = si===0 || !t.stops.slice(0,si).some(x=>x.name);
      const isLast = si===t.stops.length-1 || !t.stops.slice(si+1).some(x=>x.name);
      const cls = (isFirst&&!t.stops.slice(0,si).some(x=>x.name))?'first-stop':isLast?'last-stop':'';
      const times = [s.onTime?'on '+s.onTime:'',s.offTime?'off '+s.offTime:'',s.duration?'('+s.duration+')':''].filter(Boolean).join(' · ');
      return `<div class="tl-stop ${cls}"><div class="tl-name">${s.name}</div><div class="tl-times">${times}</div></div>`;
    }).join('');

    const card = document.createElement('div');
    card.className='trip-summary-card';
    card.innerHTML=`
      <div class="trip-summary-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
        <div class="tsn">${String(i+1).padStart(2,'0')}</div>
        <div class="ts-meta">
          <div class="ts-route">Route ${t.route||'—'} ${t.destination?'→ '+t.destination:''}</div>
          <div class="ts-from-to">${firstStop} → ${lastStop} ${boardTime&&alightTime?'· '+boardTime+' – '+alightTime:''}</div>
        </div>
        <div class="ts-dur">${totalM?formatDur(totalM):'—'}</div>
      </div>
      <div class="trip-summary-body">
        <div class="ts-pills">
          ${t.operator?`<div class="pill"><strong>Operator</strong> ${t.operator}</div>`:''}
          ${t.fleet?`<div class="pill"><strong>Fleet</strong> ${t.fleet}</div>`:''}
          ${t.reg?`<div class="pill"><strong>Reg</strong> ${t.reg}</div>`:''}
        </div>
        <div class="stop-timeline">${stopsHtml}</div>
      </div>`;
    container.appendChild(card);
  });
}

function parseDur(str){
  if(!str) return 0;
  let m=0;
  const hm=str.match(/(\d+)h/); if(hm) m+=parseInt(hm[1])*60;
  const mm=str.match(/(\d+)m/); if(mm) m+=parseInt(mm[1]);
  return m;
}

function newSession(){
  document.getElementById('screen-summary').style.display='none';
  document.getElementById('screen-setup').style.display='block';
}
</script>
</body>
</html>
