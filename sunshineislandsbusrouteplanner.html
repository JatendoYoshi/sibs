<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunshine Islands Planner — Full Network (Parsed)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:Inter;background:#020617;color:white}
header{padding:20px;text-align:center;font-size:26px;background:#0f172a}
.container{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,button{width:100%;padding:14px;border-radius:10px;border:none}
input{background:#1e293b;color:white}
button{background:#22c55e;font-weight:bold}
#map{height:420px;border-radius:14px;margin-top:20px}
.card{background:#1e293b;padding:16px;border-radius:14px;margin-top:15px}
</style>
</head>
<body>
<header>🚍 Sunshine Islands Planner — Full Network</header>
<div class="container">
<div class="grid">
<input list="stops" id="start" placeholder="Start stop">
<input list="stops" id="end" placeholder="Destination">
</div>
<datalist id="stops"></datalist>
<button onclick="plan()">Find Route</button>
<div id="result"></div>
<div id="map"></div>
</div>
<script>

// ================= FULL RAW DATA =================
// 🔴 PASTE YOUR ENTIRE EXCEL HERE (ALL OF IT)
const rawData = `PASTE EVERYTHING HERE EXACTLY`;

// ================= SMART PARSER =================
function parseData(tsv){
  const lines = tsv.split("\n").slice(1);
  const stops = [];

  lines.forEach(line=>{
    if(!line.trim()) return;

    const cols = line.split("\t");
    const stopName = cols[0].trim();
    const stopObj = { stop: stopName, routes:{} };

    for(let i=1;i<cols.length;i++){
      const platform = i.toString();
      const cell = cols[i];
      if(!cell) continue;

      // split multiple routes
      const entries = cell.split(",");

      entries.forEach(entry=>{
        entry = entry.trim();
        if(!entry) return;

        // remove brackets but keep content
        entry = entry.replace(/[()]/g,"");

        const parts = entry.split(" ");
        const route = parts[0];

        // everything else = direction / variant info
        const direction = parts.slice(1).join(" ") || "";

        if(!route) return;

        stopObj.routes[route] = {
          platform,
          direction
        };
      });
    }

    stops.push(stopObj);
  });

  return stops;
}

const stopsData = parseData(rawData);

// ================= BUILD ROUTES =================
const routes = {};
stopsData.forEach(s=>{
  Object.keys(s.routes).forEach(r=>{
    if(!routes[r]) routes[r]=[];
    routes[r].push(s.stop);
  });
});

// ================= GRAPH =================
const graph={};
Object.entries(routes).forEach(([r,stops])=>{
  stops.forEach((s,i)=>{
    if(!graph[s]) graph[s]=[];
    if(stops[i+1]) graph[s].push({to:stops[i+1],route:r});
    if(stops[i-1]) graph[s].push({to:stops[i-1],route:r});
  });
});

// ================= ROUTING =================
function shortest(start,end){
  const dist={},prev={},pq=[];
  Object.keys(graph).forEach(n=>dist[n]=Infinity);
  dist[start]=0;
  pq.push({node:start,d:0});

  while(pq.length){
    pq.sort((a,b)=>a.d-b.d);
    const {node}=pq.shift();
    if(node===end) break;

    (graph[node]||[]).forEach(e=>{
      const nd=dist[node]+1+(prev[node]&&prev[node].route!==e.route?0.5:0);
      if(nd<dist[e.to]){
        dist[e.to]=nd;
        prev[e.to]={from:node,route:e.route};
        pq.push({node:e.to,d:nd});
      }
    });
  }

  const path=[];
  let cur=end;
  while(prev[cur]){
    path.unshift({stop:cur,route:prev[cur].route});
    cur=prev[cur].from;
  }
  return cur===start?path:null;
}

// ================= MAP =================
const map=L.map('map').setView([51.5,-0.1],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let line;

function coord(n){
  let h=0;
  for(let i=0;i<n.length;i++) h=n.charCodeAt(i)+((h<<5)-h);
  return [51.5+(h%100)/5000,-0.1+((h>>3)%100)/5000];
}

function draw(path,start){
  if(line) map.removeLayer(line);
  const pts=[coord(start)];
  path.forEach(p=>pts.push(coord(p.stop)));
  line=L.polyline(pts,{weight:5}).addTo(map);
  map.fitBounds(line.getBounds());
}

// ================= HELPERS =================
function getInfo(stop,route){
  const s=stopsData.find(x=>x.stop===stop);
  return s?.routes[route]||{platform:"?",direction:"?"};
}

// ================= UI =================
function populate(){
  const dl=document.getElementById('stops');
  stopsData.forEach(s=>{
    let o=document.createElement('option');
    o.value=s.stop;
    dl.appendChild(o);
  });
}

function plan(){
  const s=document.getElementById('start').value;
  const e=document.getElementById('end').value;
  const path=shortest(s,e);
  const res=document.getElementById('result');

  if(!path){
    res.innerHTML="<div class='card'>No route found</div>";
    return;
  }

  let html="<div class='card'><b>Journey</b><br><br>";
  let curRoute=null;

  path.forEach(p=>{
    const info=getInfo(s,p.route);

    if(p.route!==curRoute){
      html+=`<div><b>${p.route}</b> — Platform ${info.platform} → ${info.direction}</div>`;
      curRoute=p.route;
    }

    html+=`<div>→ ${p.stop}</div>`;
  });

  html+="</div>";
  res.innerHTML=html;
  draw(path,s);
}

populate();

</script>
</body>
</html>
