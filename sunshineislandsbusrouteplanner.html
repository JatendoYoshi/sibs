<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunshine Islands Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:Inter;background:#020617;color:white}
header{padding:20px;text-align:center;font-size:26px;background:#0f172a}
.container{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,button{width:100%;padding:14px;border-radius:10px;border:none}
input{background:#1e293b;color:white}
button{background:#22c55e;font-weight:bold}
#map{height:420px;border-radius:14px;margin-top:20px}
.card{background:#1e293b;padding:16px;border-radius:14px;margin-top:15px}
</style>
</head>

<body>
<header>🚍 Sunshine Islands Bus Planner</header>

<div class="container">
  <div class="grid">
    <input list="stops" id="start" placeholder="Start stop">
    <input list="stops" id="end" placeholder="Destination">
  </div>

  <datalist id="stops"></datalist>
  <button onclick="plan()">Find Route</button>

  <div id="result"></div>
  <div id="map"></div>
</div>

<script>

// ================== PASTE FULL EXCEL DATA HERE ==================
const rawData = `PASTE YOUR FULL EXCEL DATA HERE`;

// ================== PARSER ==================
function parseData(tsv){
  const lines = tsv.split("\n").slice(1);
  const stops = [];

  lines.forEach(line=>{
    if(!line.trim()) return;

    const cols = line.split("\t");
    const stopName = cols[0].trim();
    const stopObj = { stop: stopName, routes:{} };

    for(let i=1;i<cols.length;i++){
      const platform = i.toString();
      const cell = cols[i];
      if(!cell) continue;

      cell.split(",").forEach(entry=>{
        entry = entry.trim();
        if(!entry) return;

        entry = entry.replace(/[()]/g,"");

        const parts = entry.split(" ");
        const route = parts[0];
        const direction = parts.slice(1).join(" ") || "";

        if(!route) return;

        stopObj.routes[route] = {
          platform,
          direction
        };
      });
    }

    stops.push(stopObj);
  });

  return stops;
}

const stopsData = parseData(rawData);

// ================== BUILD ROUTES ==================
const routes = {};
stopsData.forEach(s=>{
  Object.keys(s.routes).forEach(r=>{
    if(!routes[r]) routes[r]=[];
    routes[r].push(s.stop);
  });
});

// ================== WORKING ROUTING ==================
function findRoute(start, end){

  if(start === end) return [];

  const queue = [{
    stop: start,
    path: [],
    route: null
  }];

  const visited = new Set();

  while(queue.length){
    const current = queue.shift();
    const key = current.stop + "|" + current.route;

    if(visited.has(key)) continue;
    visited.add(key);

    if(current.stop === end){
      return current.path;
    }

    const stopObj = stopsData.find(s=>s.stop === current.stop);
    if(!stopObj) continue;

    for(let route in stopObj.routes){

      const nextStops = routes[route] || [];

      nextStops.forEach(nextStop=>{
        queue.push({
          stop: nextStop,
          route: route,
          path: [...current.path, {
            stop: nextStop,
            route: route
          }]
        });
      });

    }
  }

  return null;
}

// ================== MAP ==================
const map=L.map('map').setView([51.5,-0.1],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let line;

function coord(name){
  let h=0;
  for(let i=0;i<name.length;i++) h=name.charCodeAt(i)+((h<<5)-h);
  return [51.5+(h%100)/5000,-0.1+((h>>3)%100)/5000];
}

function draw(path,start){
  if(line) map.removeLayer(line);

  const pts=[coord(start)];
  path.forEach(p=>pts.push(coord(p.stop)));

  line=L.polyline(pts,{weight:5}).addTo(map);
  map.fitBounds(line.getBounds());
}

// ================== HELPERS ==================
function getInfo(stop,route){
  const s = stopsData.find(x=>x.stop===stop);
  return s?.routes[route] || {platform:"?",direction:"?"};
}

function populate(){
  const dl=document.getElementById('stops');
  stopsData.forEach(s=>{
    let o=document.createElement('option');
    o.value=s.stop;
    dl.appendChild(o);
  });
}

// ================== PLAN ==================
function plan(){
  const start=document.getElementById('start').value;
  const end=document.getElementById('end').value;

  const path = findRoute(start,end);
  const res=document.getElementById('result');

  if(!path){
    res.innerHTML="<div class='card'>No route found</div>";
    return;
  }

  let html="<div class='card'><b>Journey</b><br><br>";
  let currentRoute=null;

  path.forEach(step=>{
    const info = getInfo(step.stop, step.route);

    if(step.route !== currentRoute){
      html += `<div><b>${step.route}</b> — Platform ${info.platform} → ${info.direction}</div>`;
      currentRoute = step.route;
    }

    html += `<div>→ ${step.stop}</div>`;
  });

  html += "</div>";

  res.innerHTML = html;
  draw(path,start);
}

populate();

</script>
</body>
</html>
